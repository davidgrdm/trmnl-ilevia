- keyname: stop_name
  name: Arrêt de bus ou de tram (facultatif)
  field_type: string
  optional: true
  placeholder: République Beaux-Arts
  help_text: "Nom de l'arrêt tel qu'affiché sur le poteau. Les accents et tirets sont ignorés. Laissez vide pour n'afficher que le métro."
- keyname: stop_city
  name: Commune de l'arrêt (facultatif)
  field_type: string
  optional: true
  placeholder: Lille
  help_text: "Utile quand plusieurs communes ont un arrêt du même nom (ex. « Republique » existe à Loos, Wattrelos, Houplines…)."
- keyname: lines
  name: Lignes de bus/tram à suivre (facultatif)
  field_type: multi_string
  optional: true
  placeholder: L1, C1, TRAM
  help_text: "Codes des lignes séparés par des virgules (ex. L1, C1, 18, TRAM). Vide = toutes les lignes de l'arrêt. Les perturbations affichées suivent ces lignes et la ligne de métro choisie."
- keyname: bus_directions
  name: Directions de bus/tram à garder (facultatif)
  field_type: multi_string
  optional: true
  placeholder: Faches, Porte des Postes
  help_text: "Une partie du nom du terminus, séparée par des virgules (ex. « Faches » pour la L1 vers Faches Centre Commercial, « Tourcoing » pour le tram). Vide = toutes les directions. Si rien ne correspond, l'écran liste les directions disponibles."
