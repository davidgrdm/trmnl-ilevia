---
# Ilévia (Lille) pour TRMNL — métro, tram et bus.
# REPLACE_ME est remplacé par le compte GitHub au moment du packaging (scripts/package.sh).
name: Ilévia Lille — métro, tram, bus
strategy: polling
refresh_interval: 15
polling_url: https://REPLACE_ME.github.io/trmnl-ilevia/metro/index.json
polling_verb: GET
polling_headers: ''
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: travel
  description: >-
    <b>Ilévia Lille — métro, tram, bus.</b> Affiche les 3 prochains passages du réseau Ilévia
    (Métropole Européenne de Lille) sur votre écran : une station de métro avec ses prochains
    départs en grand, l'heure d'arrivée à la station de votre choix ;
    un arrêt de bus ou de tram avec les lignes et directions que vous suivez ; et les
    perturbations en cours sur ces lignes. Bus et tram sont en temps réel. Le métro affiche les
    horaires théoriques, car Ilévia ne publie pas le métro en temps réel en open data.
    Données rafraîchies toutes les 15 minutes, d'où l'affichage en heures (17h23) plutôt qu'en minutes.<br/><br/>
    <b>English:</b> shows upcoming departures for the Lille (France) public transport network:
    a metro station with scheduled departures, arrival time and frequency, a bus or tram stop with
    real-time departures filtered by line and direction, and live service disruptions.<br/><br/>
    Données : Ilévia / Métropole Européenne de Lille, open data (Licence Ouverte). Code source,
    questions et suggestions :
    <a class="underline" href="https://github.com/REPLACE_ME/trmnl-ilevia">github.com/REPLACE_ME/trmnl-ilevia</a>
    (onglet Issues).
- keyname: metro_station
