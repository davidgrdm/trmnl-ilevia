  help_text: "Choisissez « Aucune » pour n'afficher que le bus/tram.<br/><br/><b>À savoir :</b> les horaires du métro affichés sont théoriques, car Ilévia ne publie pas le métro en temps réel en open data. En semaine, le métro passe environ toutes les 1 à 2 min aux heures de pointe et toutes les 4 à 6 min en soirée ; le week-end, toutes les 2 à 8 min selon l'heure. Service d'environ 5h15 à 0h30 (1h30 le vendredi et le samedi soir). Les perturbations, elles, sont affichées en direct."
